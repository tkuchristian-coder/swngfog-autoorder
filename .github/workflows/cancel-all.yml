name: Cancel All (status + cancel per OID)

on:
  workflow_dispatch:
    inputs:
      oids:
        description: 'OIDs (逗號分隔)'
        required: true
        type: string

jobs:
  cancel_all:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - env:
          SWNGFOG_API_KEY: ${{ secrets.SWNGFOG_API_KEY }}
          OIDS: ${{ github.event.inputs.oids }}
        run: python cancel_all.py
